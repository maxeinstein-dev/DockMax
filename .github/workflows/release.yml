name: Release

# Spec 0019 G3: a `vX.Y.Z` tag builds the NSIS installer, signs it for the
# updater and publishes the GitHub Release with the `latest.json` the app
# reads (`plugins.updater.endpoints` in tauri.conf.json).
on:
  push:
    tags: ["v*"]

# One release at a time; a second tag waits instead of cancelling the first.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # The tag must be the version the three files carry, or the installer and
  # `latest.json` would announce another number than the Release.
  version:
    name: version
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The tag matches tauri.conf.json, Cargo.toml and package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          want="${TAG#v}"
          conf="$(jq -r .version src-tauri/tauri.conf.json)"
          pkg="$(jq -r .version package.json)"
          cargo="$(sed -n '/^\[package\]/,/^\[/{s/^version = "\(.*\)"$/\1/p}' src-tauri/Cargo.toml | head -n1)"
          echo "tag: $want; tauri.conf.json: $conf; Cargo.toml: $cargo; package.json: $pkg"
          failed=0
          for pair in "tauri.conf.json:$conf" "Cargo.toml:$cargo" "package.json:$pkg"; do
            if [ "${pair#*:}" != "$want" ]; then
              echo "::error::${pair%%:*} has version '${pair#*:}', the tag is '$TAG'"
              failed=1
            fi
          done
          exit "$failed"

  release:
    name: release
    needs: version
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No `version`: the action reads `packageManager` from package.json.
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # With no arguments, rustup installs the channel and components from rust-toolchain.toml.
      - name: Install Rust toolchain
        run: |
          rustup toolchain install
          rustup show

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
          key: release

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Builds the installer (`beforeBuildCommand` builds the frontend), signs
      # it with the updater key and publishes it with `latest.json`.
      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Dockyard ${{ github.ref_name }}"
          releaseBody: "Veja as mudanças em https://github.com/${{ github.repository }}/commits/${{ github.ref_name }}"
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          tauriScript: pnpm tauri
