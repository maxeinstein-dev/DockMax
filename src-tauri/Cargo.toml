[package]
name = "dockmax"
version = "0.2.0"
description = "Windows desktop dock built with Tauri"
authors = ["Maxsuel Einstein"]
license-file = "../LICENSE"
publish = false
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "dockmax_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Test build for the E2E suite (spec 0003 §2.8): embeds a WebDriver server
# and takes the app's data folder from `DOCKMAX_E2E_DATA_DIR`. Built only with
# `src-tauri/tauri.e2e.conf.json`, never shipped.
e2e = ["dep:tauri-plugin-wdio-webdriver"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tauri-plugin-log = "2"
log = "0.4"
tauri-plugin-single-instance = "2"
tauri-plugin-wdio-webdriver = { version = "1.5", optional = true }
# Widget database (spec 0003 §2.4): SQLite compiled into the binary, so the
# app never depends on a system copy, and migrations versioned in
# `PRAGMA user_version`.
rusqlite = { version = "0.40", features = ["bundled"] }
rusqlite_migration = "2.6"
# Widget instance IDs: UUID v7, made in Rust.
uuid = { version = "1", features = ["v7", "serde"] }
# Only to check clock time zone names against the IANA database. Without the
# defaults it reads no system time zone and no zoneinfo folder: names are
# looked up in the copy of the database compiled into the binary, the same on
# every machine.
jiff = { version = "0.2", default-features = false, features = ["std", "tzdb-bundle-always"] }
# Syntax check of shortcut URLs (spec 0003 §2.5); never opens them.
url = "2"

[dev-dependencies]
tempfile = "3"
# `tauri::test`: the mock runtime that checks the builder (`lib.rs`) without
# a window. No extra crate: the feature only exposes the module.
tauri = { version = "2", features = ["test"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# The WebView2 interfaces Tauri builds on, for the memory target of the
# hidden panel (spec 0003 §2.12). The version tauri-runtime-wry uses.
webview2-com = "0.39"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
