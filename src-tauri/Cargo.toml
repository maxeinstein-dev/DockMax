[package]
name = "dockyard"
version = "0.4.0"
description = "Windows desktop dock built with Tauri"
authors = ["Maxsuel Einstein"]
license-file = "../LICENSE"
publish = false
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "dockyard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Test build for the E2E suite (spec 0003 §2.8): embeds a WebDriver server
# and takes the app's data folder from `DOCKMAX_E2E_DATA_DIR`. Built only with
# `src-tauri/tauri.e2e.conf.json`, never shipped.
e2e = ["dep:tauri-plugin-wdio-webdriver"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tauri-plugin-log = "2"
log = "0.4"
tauri-plugin-single-instance = "2"
tauri-plugin-wdio-webdriver = { version = "1.5", optional = true }
# Widget database (spec 0003 §2.4): SQLite compiled into the binary, so the
# app never depends on a system copy, and migrations versioned in
# `PRAGMA user_version`.
rusqlite = { version = "0.40", features = ["bundled"] }
rusqlite_migration = "2.6"
# Widget instance IDs: UUID v7, made in Rust.
uuid = { version = "1", features = ["v7", "serde"] }
# Only to check clock time zone names against the IANA database. Without the
# defaults it reads no system time zone and no zoneinfo folder: names are
# looked up in the copy of the database compiled into the binary, the same on
# every machine.
jiff = { version = "0.2", default-features = false, features = ["std", "tzdb-bundle-always"] }
# The icons of the notification area, as PNG `data:` URLs for the dock's
# pages (ADR 0009): both are already in the build through Tauri.
png = "0.17"
base64 = "0.22"
# Syntax check of shortcut URLs (spec 0003 §2.5); never opens them.
url = "2"
# Automatic update (spec 0019 G3): GitHub Releases, signed; it checks and
# installs only through `windows::update`, never from a page.
tauri-plugin-updater = "2"

[dev-dependencies]
tempfile = "3"
# `tauri::test`: the mock runtime that checks the builder (`lib.rs`) without
# a window. No extra crate: the feature only exposes the module.
tauri = { version = "2", features = ["test"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Data_Xml_Dom",
    "Media_Control",
    "Storage_Streams",
    "UI_Notifications",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Imaging",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinHttp",
    "Win32_Security_Credentials",
    "Win32_Security_Cryptography",
    "Win32_Networking_WinSock",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Packaging_Appx",
    "Win32_UI_WindowsAndMessaging",
] }
# `#[implement]` (the dock's drop target) names this crate in what it expands
# to; the version `windows` uses.
windows-core = "0.62"
# The points and matrices Direct2D takes (the dock, spec 0011 H3): the version
# `windows` uses.
windows-numerics = "0.3"
# The WebView2 interfaces Tauri builds on, for the memory target of the
# hidden panel (spec 0003 §2.12). The version tauri-runtime-wry uses.
webview2-com = "0.39"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
